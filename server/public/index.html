<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>食物分析与营养追踪</title>
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <div class="container">
            <div class="welcome-card">
                <div class="header">
                    <h1>🍎 食物分析系统 v2</h1>
                    <p>
                        欢迎使用全自动食物分析与营养追踪系统。我们的设备会自动完成食物图像采集、称重与分析，为你提供详细的营养信息和健康建议。
                    </p>
                </div>

                <div class="status-section">
                    <div>
                        <span class="status-indicator"></span>
                        <span class="status-text" id="statusText"
                            >系统已就绪 - 等待设备数据</span
                        >
                    </div>
                    <div class="instructions">
                        系统已准备好接收食物分析设备的数据。请将食物放在秤上，分析会自动开始。
                    </div>
                    <div class="last-update" id="lastUpdate"></div>
                </div>

                <div class="profile-section" aria-label="用户画像">
                    <h2 class="section-title">👤 用户画像</h2>
                    <div class="profile-grid">
                        <div class="form-row">
                            <label for="profileAge">年龄</label>
                            <input id="profileAge" type="number" min="0" max="120" placeholder="例如：28" />
                        </div>
                        <div class="form-row">
                            <label for="profileSex">性别</label>
                            <select id="profileSex">
                                <option value="">未选择</option>
                                <option value="male">男</option>
                                <option value="female">女</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="profileHeightCm">身高（cm）</label>
                            <input id="profileHeightCm" type="number" min="0" max="250" placeholder="例如：172" />
                        </div>
                        <div class="form-row">
                            <label for="profileWeightKg">体重（kg）</label>
                            <input id="profileWeightKg" type="number" min="0" max="300" step="0.1" placeholder="例如：65" />
                        </div>
                        <div class="form-row form-row-wide">
                            <label for="profileAllergens">过敏原（用逗号分隔）</label>
                            <input id="profileAllergens" type="text" placeholder="例如：花生, 牛奶, 虾" />
                        </div>
                        <div class="form-row form-row-wide">
                            <label>目标</label>
                            <div class="checkbox-row">
                                <label class="checkbox-item"><input id="goalFatLoss" type="checkbox" />减脂</label>
                                <label class="checkbox-item"><input id="goalMuscleGain" type="checkbox" />增肌</label>
                            </div>
                        </div>
                        <div class="form-row form-row-wide">
                            <label>慢病/情况</label>
                            <div class="checkbox-row">
                                <label class="checkbox-item"><input id="condDiabetes" type="checkbox" />糖尿病</label>
                                <label class="checkbox-item"><input id="condHypertension" type="checkbox" />高血压</label>
                                <label class="checkbox-item"><input id="condKidney" type="checkbox" />肾病</label>
                                <label class="checkbox-item"><input id="condGout" type="checkbox" />痛风</label>
                                <label class="checkbox-item"><input id="condAllergy" type="checkbox" />过敏</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button id="profileSaveBtn" class="primary-btn" type="button">保存画像</button>
                        <span id="profileStatus" class="form-hint" aria-live="polite"></span>
                    </div>
                </div>
            </div>

            <div id="loadingSection" class="loading">
                <div class="spinner"></div>
                <p>正在分析食物数据...</p>
            </div>

            <div id="resultsSection" class="results-section">
                <!-- Results will be displayed here -->
            </div>
        </div>

        <script src="js/index.js"></script>
    </body>
</html>
